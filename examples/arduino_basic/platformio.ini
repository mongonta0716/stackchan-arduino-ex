; Arduino/PlatformIO target. SCEX_BasicConfig.yaml's default servo.axes use
; the m5_scs driver (M5StackChan's Feetech SCS0009 servos + PY32IOExpander
; power control), which is wired on the CoreS3-based official kit -- hence
; board=m5stack-cores3 (ESP32-S3) below. This library itself has no
; M5Unified dependency though, so if you swap SCEX_BasicConfig.yaml's axes
; back to driver: pwm with your own pins, any ESP32 board works fine.
[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
lib_deps = https://github.com/mongonta0716/stackchan-arduino-ex
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
board_build.filesystem = spiffs
