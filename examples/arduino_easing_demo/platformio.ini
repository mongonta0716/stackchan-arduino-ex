; Easing pattern demo: Button A plays the displayed SCEX_Easing.h curve and
; Button C selects the next one. Holding Button B for two seconds auto-plays
; through the final curve. Uses M5Unified for the button/display convenience -- the
; core library itself has no M5Unified dependency (see examples/arduino_basic
; and examples/esp-idf_basic for M5Unified-free examples).
[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
lib_deps =
    symlink://../..
    m5stack/M5Unified
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
board_build.filesystem = spiffs
